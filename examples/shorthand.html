<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>showmo — shorthand in markup</title>
  <script src="../dist/showmo.min.js" defer></script>
</head>
<body>
  <label>Country
    <select id="country">
      <option value="US">US</option>
      <option value="NP">Nepal</option>
    </select>
  </label>

  <label><input type="checkbox" id="newsletter" value="yes" /> Subscribe</label>

  <div data-showmo="#country:NP">
    Shown when country is Nepal.
  </div>

  <div data-showmo="#country:NP && #newsletter" data-showmo-clear="true">
    Shown when Nepal AND subscribed; cleared while hidden.
  </div>

  <div data-showmo="#country:US,CA" data-showmo-class="is-hidden">
    Shown for US or Canada; gets .is-hidden class while hidden.
  </div>
</body>
</html>
